name: Msngr
options:
  bundleIdPrefix: ai.enface
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MsngrKit:
    path: MsngrKit
schemes:
  Msngr:
    build:
      targets:
        Msngr: all
    test:
      targets: [MsngrTests, MsngrUITests]
      environmentVariables:
        # forwards a custom server stand into MsngrUITests; defaults to the
        # shared wrangler dev when unset (see SmokeTests.swift)
        MSNGR_SERVER: "$(MSNGR_SERVER)"
targets:
  Msngr:
    type: application
    platform: iOS
    sources: [Msngr]
    entitlements:
      path: Msngr/Msngr.entitlements
      properties:
        com.apple.security.application-groups: [group.ai.enface.msngr]
        # аватар и имя отправителя в баннере (Communication Notifications)
        com.apple.developer.usernotifications.communication: true
    dependencies:
      - package: MsngrKit
        product: MsngrCrypto
      - package: MsngrKit
        product: MsngrCore
      - target: NotificationService
        embed: true
    info:
      path: Msngr/Info.plist
      properties:
        CFBundleDisplayName: Msngr
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Запись голосовых сообщений"
        NSCameraUsageDescription: "Фото и видео для отправки в чаты"
        NSPhotoLibraryUsageDescription: "Выбор фото и видео для отправки"
        NSContactsUsageDescription: "Поиск знакомых, которые уже в Msngr"
        NSFaceIDUsageDescription: "Разблокировка приложения"
        UIBackgroundModes: [remote-notification]
        NSUserActivityTypes: [INSendMessageIntent]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [msngr]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MsngrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MsngrTests]
    dependencies:
      - target: Msngr
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ai.enface.MsngrTests

  MsngrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MsngrUITests]
    dependencies:
      - target: Msngr
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ai.enface.MsngrUITests
        TEST_TARGET_NAME: Msngr

  MsngrMac:
    type: application
    platform: macOS
    sources: [MsngrMac]
    entitlements:
      path: MsngrMac/MsngrMac.entitlements
    dependencies:
      - package: MsngrKit
        product: MsngrCrypto
      - package: MsngrKit
        product: MsngrCore
    info:
      path: MsngrMac/Info.plist
      properties:
        CFBundleDisplayName: Msngr
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Запись голосовых сообщений"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.enface.MsngrMac
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false

  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    entitlements:
      path: NotificationService/NotificationService.entitlements
    dependencies:
      - package: MsngrKit
        product: MsngrCrypto
      - package: MsngrKit
        product: MsngrCore
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: MsngrNotifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.enface.Msngr.NotificationService
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false
