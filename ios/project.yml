name: Msngr
options:
  bundleIdPrefix: msngr
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# the signing team is machine-local: Config/Signing.xcconfig is gitignored and
# included from Local.xcconfig only if it exists
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
packages:
  MsngrKit:
    path: MsngrKit
  Pulse:
    url: https://github.com/kean/Pulse
    from: 5.0.0
schemes:
  Msngr:
    build:
      targets:
        Msngr: all
    test:
      targets: [MsngrTests, MsngrUITests]
      environmentVariables:
        # forwards a custom server stand into MsngrUITests; defaults to the
        # shared wrangler dev when unset (see SmokeTests.swift)
        MSNGR_SERVER: "$(MSNGR_SERVER)"
targets:
  Msngr:
    type: application
    platform: iOS
    sources: [Msngr]
    entitlements:
      path: Msngr/Msngr.entitlements
      properties:
        com.apple.security.application-groups: [group.msngr.msngr]
        # sender avatar and name in the banner (Communication Notifications)
        com.apple.developer.usernotifications.communication: true
    dependencies:
      - package: MsngrKit
        product: MsngrCrypto
      - package: MsngrKit
        product: MsngrCore
      - package: Pulse
        product: Pulse
      - package: Pulse
        product: PulseUI
      - package: Pulse
        product: PulseProxy
      - target: NotificationService
        embed: true
      - target: ShareExtension
        embed: true
    info:
      path: Msngr/Info.plist
      properties:
        CFBundleDisplayName: Msngr
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Запись голосовых сообщений"
        NSCameraUsageDescription: "Фото и видео для отправки в чаты"
        # a shader that reads iLocation asks for this the first time it runs
        NSLocationWhenInUseUsageDescription: "Положение и направление для шейдеров, которые их читают"
        # a device build points at the dev stand over the LAN; empty otherwise
        MSNGRServer: ${MSNGR_DEVICE_SERVER}
        # the stand speaks plain http, which ATS only tolerates for local hosts
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: "Выбор фото и видео для отправки"
        NSContactsUsageDescription: "Поиск знакомых, которые уже в Msngr"
        NSFaceIDUsageDescription: "Разблокировка приложения"
        NSSpeechRecognitionUsageDescription: "Транскрипт голосовых сообщений на устройстве"
        UIBackgroundModes: [remote-notification]
        NSUserActivityTypes: [INSendMessageIntent]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [msngr]
    settings:
      base:
        # msngr.msngr everywhere; a device build substitutes the signing
        # team's own id (make device, local.mk)
        PRODUCT_BUNDLE_IDENTIFIER: ${MSNGR_APP_ID}
        SWIFT_VERSION: "5.9"
        # iPhone and iPad: the iPad layout is what a Mac runs as
        # «Designed for iPad», the MVP shape of the desktop client
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MsngrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MsngrTests]
    dependencies:
      - target: Msngr
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: msngr.MsngrTests

  MsngrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MsngrUITests]
    dependencies:
      - target: Msngr
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: msngr.MsngrUITests
        TEST_TARGET_NAME: Msngr

  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    entitlements:
      path: NotificationService/NotificationService.entitlements
    dependencies:
      - package: MsngrKit
        product: MsngrCrypto
      - package: MsngrKit
        product: MsngrCore
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: MsngrNotifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${MSNGR_APP_ID}.NotificationService
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false

  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.msngr.msngr]
    dependencies:
      - package: MsngrKit
        product: MsngrCrypto
      - package: MsngrKit
        product: MsngrCore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Msngr
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareNavigationController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${MSNGR_APP_ID}.ShareExtension
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: false
